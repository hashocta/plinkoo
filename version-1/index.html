<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Canvas Game</title>
  <style>
    canvas {
      background-color: #000;
      display: block;
      margin: 0 auto;
    }

    #add-ball {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #0f0;
      color: #000;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    #add-ball:hover {
      background-color: #0c0;
    }
  </style>
</head>

<body>
  <canvas id="gameCanvas"></canvas>
  <button id="add-ball">Add Ball</button>
  <script>
    // Configuration and Constants
    const CONFIG = {
      width: 800,
      height: 800,
      ballRadius: 7,
      obstacleRadius: 4,
      gravity: 0.2,
      horizontalFriction: 0.4,
      verticalFriction: 0.8,
      frameRate: 60,
      sinkWidth: 36,
      numSinks: 15,
      obstacleSpacing: 36,
      rows: 16
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CONFIG.width;
    canvas.height = CONFIG.height;

    const balls = [];
    const obstacles = [];
    const sinks = [];

    // Utility Functions
    const randomColor = () => `#${Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')}`;
    const distance = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

    // Create Obstacles (Pyramid Shape)
    for (let row = 2; row < CONFIG.rows; row++) {
      const numObstacles = row + 1;
      const y = row * CONFIG.obstacleSpacing;
      for (let col = 0; col < numObstacles; col++) {
        const x = CONFIG.width / 2 - CONFIG.obstacleSpacing * (row / 2 - col);
        obstacles.push({ x, y, radius: CONFIG.obstacleRadius });
      }
    }

    // Create Sinks (Bottom Rectangles)
    for (let i = 0; i < CONFIG.numSinks; i++) {
      const x = CONFIG.width / 2 + (i - CONFIG.numSinks / 2) * CONFIG.sinkWidth;
      const y = CONFIG.height - 40;
      sinks.push({ x, y, width: CONFIG.sinkWidth, height: CONFIG.sinkWidth });
    }

    // Ball Class
    class Ball {
      constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = 0;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.closePath();
      }

      update() {
        // Apply gravity
        this.vy += CONFIG.gravity;

        // Update position
        this.x += this.vx;
        this.y += this.vy;

        // Collision with obstacles
        obstacles.forEach(obstacle => {
          const dist = distance(this.x, this.y, obstacle.x, obstacle.y);
          if (dist < this.radius + obstacle.radius) {
            const angle = Math.atan2(this.y - obstacle.y, this.x - obstacle.x);
            const speed = Math.sqrt(this.vx ** 2 + this.vy ** 2);
            this.vx = Math.cos(angle) * speed * CONFIG.horizontalFriction;
            this.vy = Math.sin(angle) * speed * CONFIG.verticalFriction;

            // Adjust position to prevent overlap
            const overlap = this.radius + obstacle.radius - dist;
            this.x += Math.cos(angle) * overlap;
            this.y += Math.sin(angle) * overlap;
          }
        });

        // Collision with sinks
        sinks.forEach(sink => {
          if (
            this.x > sink.x - sink.width / 2 &&
            this.x < sink.x + sink.width / 2 &&
            this.y + this.radius > sink.y
          ) {
            this.vx = 0;
            this.vy = 0;
            this.y = sink.y - this.radius; // Rest on sink
          }
        });

        // Boundary collisions
        if (this.x - this.radius < 0 || this.x + this.radius > CONFIG.width) {
          this.vx *= -CONFIG.horizontalFriction;
          this.x = Math.max(this.radius, Math.min(this.x, CONFIG.width - this.radius));
        }
        if (this.y - this.radius < 0 || this.y + this.radius > CONFIG.height) {
          this.vy *= -CONFIG.verticalFriction;
          this.y = Math.max(this.radius, Math.min(this.y, CONFIG.height - this.radius));
        }
      }
    }

    // Draw Obstacles
    function drawObstacles() {
      ctx.fillStyle = 'white';
      obstacles.forEach(obstacle => {
        ctx.beginPath();
        ctx.arc(obstacle.x, obstacle.y, obstacle.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
      });
    }

    // Draw Sinks
    function drawSinks() {
      ctx.fillStyle = 'green';
      sinks.forEach(sink => {
        ctx.fillRect(sink.x - sink.width / 2, sink.y, sink.width, sink.height);
      });
    }

    // Add a Ball
    function addBall() {
      const newBall = new Ball(CONFIG.width / 2, 50, CONFIG.ballRadius, randomColor());
      balls.push(newBall);
    }

    document.getElementById('add-ball').addEventListener('click', addBall);

    // Game Loop
    let lastTime = 0;
    function gameLoop(time) {
      const deltaTime = time - lastTime;
      if (deltaTime >= 1000 / CONFIG.frameRate) {
        ctx.clearRect(0, 0, CONFIG.width, CONFIG.height);
        drawObstacles();
        drawSinks();
        balls.forEach(ball => {
          ball.draw();
          ball.update();
        });
        lastTime = time;
      }
      requestAnimationFrame(gameLoop);
    }

    // Start the Game
    gameLoop(0);
  </script>
</body>

</html>
